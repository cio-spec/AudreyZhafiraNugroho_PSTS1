<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Creativity Festival Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 font-sans min-h-screen py-10 px-4">
    <div class="max-w-4xl mx-auto space-y-10">

        <header class="bg-gradient-to-r from-pink-400 to-pink-500 text-white p-6 sm:p-8 rounded-2xl shadow-md text-center">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-tight mb-2">Student Creativity Festival</h1>
            <p class="text-pink-100 text-sm sm:text-base">Showcase Your Creativity, Skills and Innovative Ideas</p>
        </header>

    <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8 max-w-4xl w-full border border-pink-400">
        
        <form action="#" method="POST" class="space-y-6" onsubmit="event.preventDefault(); this.reset(); alert('Reservation submitted successfully!');">
            
            <div>
                <label for="borrower-name" class="block text-sm font-medium text-gray-700 mb-1">
                 Student Name👤<span class="text-red-500">*</span>
                </label>
                <input type="text" id="borrower-name" name="borrower_name" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition"
                    placeholder="Enter your full name">
            </div>
            
            <div>
                <label for="lab" class="block text-sm font-medium text-gray-700 mb-1">
                    Class👩🏻‍🏫<span class="text-red-500">*</span>
                </label>
                <select id="lab" name="lab" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition bg-white">
                    <option value="" disabled selected>Class</option>
                    <option value="X">X</option>
                    <option value="XI">XI</option>
                    <option value="XII">XII</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Gender♀️♂️<span class="text-red-500">*</span>
                </label>
                <div class="flex flex-wrap gap-4 sm:gap-6">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="status" value="Teacher" required class="accent-pink-500">
                        <span class="ml-2 text-sm text-gray-700">Male</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="status" value="Student" class="accent-pink-500">
                        <span class="ml-2 text-sm text-gray-700">Female</span>
                    </label>
                </div>
            </div>

            <div>
                <label for="lab" class="block text-sm font-medium text-gray-700 mb-1">
                    Competition Category🏆<span class="text-red-500">*</span>
                </label>
                <select id="lab" name="lab" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition bg-white">
                    <option value="Competition Category" disabled selected>Competiton category</option>
                    <option value="Web Development">Web Development</option>
                    <option value="Iot Project">Iot Project</option>
                    <option value="Graphic Design">Graphic Design</option>
                    <option value="Public Speaking">Public Speaking</option>
                    <option value="Photography">Photography</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Participation Type🙋‍♂️<span class="text-red-500">*</span>
                </label>
                <div class="flex flex-wrap gap-4 sm:gap-6">
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="status" value="Teacher" required class="accent-pink-500">
                        <span class="ml-2 text-sm text-gray-700">Individual</span>
                    </label>
                    <label class="inline-flex items-center cursor-pointer">
                        <input type="radio" name="status" value="Student" class="accent-pink-500">
                        <span class="ml-2 text-sm text-gray-700">Team</span>
                    </label>
                </div>
            </div>

             <div>
                <label for="borrower-name" class="block text-sm font-medium text-gray-700 mb-1">
                 Team Name👤<span class="text-red-500">*</span>
                </label>
                <input type="text" id="borrower-name" name="borrower_name" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition"
                    placeholder="Enter your team's name">
            </div>
            
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                    Contact Number📞<span class="text-red-500">*</span>
                </label>
                <input type="tel" id="phone" name="phone_number" required
                    pattern="[0-9]{10,13}"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition"
                    placeholder="08xxxxxxxx">
            </div>

            <div>
                <label for="requirements" class="block text-sm font-medium text-gray-700 mb-1">
                    Project Description📝
                </label>
                <textarea id="requirements" name="special_requirements" rows="3"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-pink-500 outline-none transition"
                    placeholder="Describe your project or competition entry.."></textarea>
            </div>

            <div>
                <button type="submit"
                    class="w-full bg-pink-500 hover:bg-pink-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Register Now🚀✨
                </button>
            </div>
        </form>
    </div>

        <section class="bg-white rounded-2xl shadow-lg border border-pink-200 overflow-hidden">
            <div class="p-6 border-b border-pink-100">
                <h2 class="text-xl font-bold text-gray-800">📊 Participant List</h2>
            </div>
            
            <div class="overflow-x-auto">
                <!-- border-collapse: Menghilangkan celah ganda antar border sel tabel -->
                <table class="w-full text-left border-collapse">
                    
                    <!-- THEAD: Bagian Judul Kolom Tabel -->
                    <thead>
                        <tr class="bg-pink-100 text-pink-900 border-b border-pink-200 text-xs uppercase tracking-wider">
                            <th class="py-3 px-4 text-center">No</th>
                            <th class="py-3 px-4">Participant</th>
                            <th class="py-3 px-4">Class</th>
                            <th class="py-3 px-4">Category</th>
                            <th class="py-3 px-4">Team</th>
                            <th class="py-3 px-4">Status</th>
                        </tr>
                    </thead>
                    
                    <tbody class="divide-y divide-pink-100 text-sm text-gray-700">
                        <!-- Baris Data 1 -->
                        <tr class="hover:bg-pink-50/50 transition">
                            <td class="py-3 px-4 text-center font-medium">1</td>
                            <td class="py-3 px-4 font-medium text-gray-900">Audrey Zhafira Nugroho</td>
                            <td class="py-3 px-4">X</td>
                            <td class="py-3 px-4">Web Development</td>
                            <td class="py-3 px-4">CodeX</td>
                            <td class="py-3 px-4"><span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-semibold">Registered</span></td>
                        </tr>
                        <!-- Baris Data 2 -->
                        <tr class="hover:bg-pink-50/50 transition">
                            <td class="py-3 px-4 text-center font-medium">2</td>
                            <td class="py-3 px-4 font-medium text-gray-900">Aisyah Putri</td>
                            <td class="py-3 px-4">XI</td>
                            <td class="py-3 px-4">Iot Project</td>
                            <td class="py-3 px-4">SmartTech</td>
                            <td class="py-3 px-4"><span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold">Pending</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</body>
</html>
